/* ── NAV ── */

}
.nav-brand img {

}
.nav-center {

.nav-center a {

.nav-right {

.nav-social {

/* ── PAGE BACKGROUND ── */

  background-position: center top;

}
.page-bg-overlay {

  inset: 0;
  background: rgba(0,0,0,0.62);

}

.event-back {

.event-back svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }

  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.event-info-label {

      <span class="event-meta-label">Lineup</span>
      <span class="event-meta-value">${ev.artists.join(' · ')}</span>
    </div>
  `;

  const cta = document.getElementById('eventCta');
  cta.href = ev.posh;
  const isPast = ev.dateISO && new Date(ev.dateISO) < new Date();
  if (isPast) {
    cta.textContent = 'View Event';
    cta.classList.add('past');
  } else {
    cta.textContent = 'Buy Tickets';
  }
} else {
  document.getElementById('eventHero').style.display = 'none';
  document.getElementById('eventDetail').innerHTML = '<p class="event-not-found">Event not found. <a href="events.html" style="color:rgba(255,255,255,0.5);text-decoration:underline">Back to Events</a></p>';
}

// ── AUTH + PROFILE ──
</script>
